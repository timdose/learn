<div id="timePreferencePopup" class="modal hidden">
    <div class="modal-content">
        <span class="close" data-test-id="close-time-preference-popup">&times;</span>
        <h2>You've been added to the waitlist!</h2>
        <p>Please select your preferred time for the workshop.</p>
        <form id="timePreferenceForm">
            <input type="radio" id="morning" name="time" value="morning">
            <label for="morning">Morning</label>
            <input type="radio" id="afternoon" name="time" value="afternoon">
            <label for="afternoon">Afternoon</label>
            <input type="radio" id="evening" name="time" value="evening">
            <label for="evening">Evening</label>
            <input type="hidden" name="waitlistEmail" id="submittedWaitlistEmail" value="">
            <div class="button-container">
                <button type="submit" id="submitTimePreferenceButton" class="button" data-test-id="submit-time-preference-button">Submit</button>
            </div>
        </form>
    </div>
</div>
