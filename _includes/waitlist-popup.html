<!-- Add this at the end of the body -->
<div id="waitlistPopup" class="modal">
    <div class="modal-content">
        <form id="waitlistForm">
            <span class="close" data-test-id="close-waitlist-popup">&times;</span>
            <h2>Join the waitlist</h2>
            <p>Registration is currently closed. We'll notify you when registration opens.</p>
            <div class="pricing-info">
                <p id="waitlistItemName"></p>
                <p>
                    <span id="waitlistOriginalPrice"></span>
                    <span id="waitlistPrice"></span> 
                    <span id="waitlistDiscount"></span>
                </p>
            </div>
            <input type="email" id="waitlistEmail" name="email" placeholder="Enter your email" required>
            <input type="hidden" name="courseName" id="hiddenCourseName" value="{{page.title}}">
            <input type="hidden" name="itemName" id="hiddenItemName" value="Workshop Name">
            <input type="hidden" name="price" id="hiddenPrice" value="99.99">
            <input type="hidden" name="originalPrice" id="hiddenOriginalPrice" value="149.99">
            <input type="hidden" name="discount" id="hiddenDiscount" value="33">
            <input type="hidden" name="requestId" id="hiddenRequestId">
            <button type="submit" id="submitWaitlistButton" class="button large" data-test-id="submit-waitlist-popup">Join waitlist</button>
        </form>     
    </div>
</div>
