<!-- Add this at the end of the body -->
<div id="waitlistPopup" class="modal">
    <div class="modal-content">
        <form id="waitlistForm">
            <span class="close">&times;</span>
            <h2>Join the waitlist</h2>
            <p>Registration is currently closed. We'll notify you when registration opens.</p>
            <div class="pricing-info">
                <p id="waitlistItemName"></p>
                <p>
                    <span id="waitlistOriginalPrice"></span>
                    <span id="waitlistPrice"></span> 
                    <span id="waitlistDiscount"></span>
                </p>
            </div>
            <input type="email" id="waitlistEmail" name="email" placeholder="Enter your email" required oninput="console.log('Email input changed:', this.value)">
            <input type="hidden" name="itemName" id="hiddenItemName">
            <input type="hidden" name="price" id="hiddenPrice">
            <input type="hidden" name="originalPrice" id="hiddenOriginalPrice">
            <input type="hidden" name="discount" id="hiddenDiscount">
            <button type="submit" id="submitWaitlistButton" class="button">Join waitlist</button>
        </form>     
    </div>
</div>
