<!-- Add this at the end of the body -->
<div id="waitlistPopup" class="modal hidden">
    <div class="modal-content">
        <span class="close">&times;</span>
        <h2>Join the Course Waitlist</h2>
        <p>The course is currently full, but you can join the waitlist.</p>
        <p>You're interested in the <strong><span id="waitlistPrice"></span></strong> price option.</p>
        <p>Enter your email to be notified when registration opens:</p>
        <input type="email" id="waitlistEmail" placeholder="Enter your email" required>
        <button id="submitWaitlist" class="button">Join Waitlist</button>
    </div>
</div>
