<div class="paypal-button-container">
    <form action="https://www.paypal.com/cgi-bin/webscr" method="post">
        <input type="hidden" name="cmd" value="_xclick">
        <input type="hidden" name="business" value="9KKTZB5CU77W6">
        <input type="hidden" name="item_name" value="{{ include.item_name }}">
        <input type="hidden" name="currency_code" value="USD">
        <input type="hidden" name="amount" value="{{ include.price }}">
        <input type="hidden" name="shipping" value="0">
        <input type="hidden" name="tax" value="0">
        <input type="hidden" name="quantity" value="1">
        <input type="hidden" name="return" value="https://www.timdoseart.com/shading-workshop-thank-you/">
        <input type="hidden" name="cancel_return" value="{{site.url}}{{page.url}}">
        <input type="hidden" name="bn" value="PP-BuyNowBF:btn_buynow_LG.gif:NonHosted">
        <button type="submit" class="paypal-submit-button large">Buy Now</button>

        <div class="paypal-powered-by">Powered by <img src="https://www.paypalobjects.com/paypal-ui/logos/svg/paypal-wordmark-color.svg" alt="paypal" style="height:14px;vertical-align:middle;"/></div>
    </form>
</div>
