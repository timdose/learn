    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            overflow: hidden;
        }
        .image-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee;
        }
        .image-container img, .image-container canvas {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }
        #dotImage {
            clip-path: inset(0 50% 0 0); /* Initially hide the right half */
        }
        #userDotCanvas {
            z-index: 10;
            pointer-events: auto;
        }
        .button-container {
            position: absolute;
            bottom: 20px; /* Position from the bottom */
            left: 50%; /* Center horizontally */
            transform: translateX(-50%); /* Adjust to center */
            display: flex; /* Use flexbox to align buttons */
            gap: 10px; /* Space between buttons */
            pointer-events: auto; /* Ensure buttons can be clicked */
            z-index: 20; /* Ensure buttons are on top */
        }
        #checkButton, #nextButton, #prevButton {
            padding: 15px 20px; /* Adjust padding for a bigger button */
            font-size: 18px; /* Increase font size */
            background-color: #007BFF; /* Button color */
            color: white; /* Text color */
            border: none; /* Remove border */
            border-radius: 5px; /* Rounded corners */
            cursor: pointer; /* Pointer cursor on hover */
        }
        #checkButton:hover, #nextButton:hover, #prevButton:hover {
            background-color: #0056b3; /* Darker shade on hover */
        }
        /* Add this CSS to your stylesheet */
        button:disabled {
            background-color: #ccc; /* Light gray background */
            color: #666; /* Darker gray text */
            cursor: not-allowed; /* Change cursor to indicate it's not clickable */
            opacity: 0.6; /* Slightly transparent */
            pointer-events: none; /* Disable pointer events for the button */
        }
        /* Remove hover effect for disabled buttons */
        button:disabled:hover {
            background-color: #ccc; /* Keep the same background on hover */
            color: #666; /* Keep the same text color on hover */
        }
        #dotCounter {
            font-family: 'Arial', sans-serif;
            font-size: 16px; /* Adjust font size as needed */
            padding: 5px; /* Optional: padding for aesthetics */
            border-radius: 5px; /* Optional: rounded corners */
        }
        #clickX {
            color: rgba(0, 0, 255, 0.7); /* Blue color with 70% transparency */
            position: absolute; /* Position it absolutely if needed */
            z-index: 1; /* Lower z-index to ensure it doesn't overlap buttons */
            /* Add any other styles you need, like font size or positioning */
        }
        #bottomRightContainer {
            position: absolute; /* Position the container absolutely */
            bottom: 20px; /* Distance from the bottom */
            right: 20px; /* Distance from the right */
            display: flex; /* Use flexbox to align items */
            flex-direction: row; /* Stack items vertically */
            gap: 16px; /* Space between the counter and dropdown */
            align-items: center; /* Center items horizontally */
            justify-content: center; /* Center items vertically */
            height: 24px; /* Set the same height for the counter */
            padding: 16px 16px;
            background-color: rgba(255, 255, 255, 0.7); /* Optional: background for better visibility */
            border-radius: 4px; /* Optional: rounded corners */
            z-index: 20;
        }
        #subjectSelect {
            font-size: 16px; /* Adjust font size as needed */
            height: 32px;
            padding: 0 16px;
        }
        /* Add this CSS if you have a button class */
        .button {
            /* Example styles */
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        .button img {
            width: 20px; /* Adjust size as needed */
            height: 20px; /* Adjust size as needed */
        }
        /* Add this CSS for the hover state of the random button */
        #randomButton:hover {
            background-color: #0056b3; /* Darker shade on hover */
            color: white; /* Text color on hover */
            cursor: pointer; /* Pointer cursor on hover */
        }
        
        .button {
            position: relative; /* Position relative for tooltip positioning */
        }

        .tooltip {
            visibility: hidden;
            font-size: 12px;
            width: 100px; /* Adjust width to make it smaller */
            background-color: rgba(255, 255, 255, 0.655); /* Change background color to white */
            color: #666; /* Change text color to black for better contrast */
            text-align: center;
            border-radius: 5px;
            padding: 3px; /* Reduce padding for a smaller tooltip */
            position: absolute;
            z-index: 1;
            bottom: 125%; /* Position above the button */
            left: 50%;
            margin-left: -50px; /* Center the tooltip */
            opacity: 0; /* Hidden by default */
            transition: opacity 0.3s; /* Fade effect */
        }

        .button:hover .tooltip {
            visibility: visible;
            opacity: 1; /* Show tooltip on hover */
        }
        
        /* Add this CSS for active button state */
        #prevButton.active, #checkButton.active, #nextButton.active, #randomButton.active {
            background-color: #0056b3; /* Darker shade to indicate active state */
            opacity: 0.8; /* Slightly transparent */
        }
    </style>
</head>
<body>
    <div class="image-container">
        <img src="quiz/images/vase/0000.png" alt="Vase" id="subjectImage">
        <img src="quiz/images/vase/0001.png" alt="Dot Overlay" id="dotImage">
        <canvas id="userDotCanvas"></canvas>
        <div id="bottomRightContainer"> <!-- Container for counter and dropdown -->
            <span id="dotCounter">1 / 60</span> <!-- Counter for current dot image -->
            <select id="subjectSelect"> <!-- Existing subject dropdown -->
                <!-- Options will be added dynamically -->
            </select>
        </div>
        <div class="button-container"> <!-- New container for buttons -->
            <button id="prevButton" class="button">
                &larr;
                <span class="tooltip"><strong>Previous</strong><br>Shortcut: Left Arrow (←)</span>
            </button> <!-- Left arrow for Previous -->
            
            <button id="checkButton" class="button">
                Show answer
                <span class="tooltip"><strong>Show answer</strong><br>Shortcut: Space Bar</span> <!-- Updated tooltip -->
            </button> <!-- Check button -->
            
            <button id="nextButton" class="button">
                &rarr;
                <span class="tooltip"><strong>Next</strong><br>Shortcut: Right Arrow (→)</span>
            </button> <!-- Right arrow for Next -->
            
            <button id="randomButton" class="button" style="font-size: 24px;">
                🎲
                <span class="tooltip"><strong>Random</strong><br>Shortcut: R</span>
            </button> <!-- Random button -->
        </div>
    </div>
    <h1 id="subjectTitle"></h1> <!-- Ensure this element is present -->
    <script src="app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
</body>
</html>
