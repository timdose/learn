times:
  - id: Mon-Evening
    reference_time:
      day: Monday
      start: "17:00"  # 5:00 PM
      end: "19:00"    # 7:00 PM
      timezone: "America/New_York"
  - id: Tue-Afternoon
    reference_time:
      day: Tuesday
      start: "13:00"  # 1:00 PM
      end: "15:00"    # 3:00 PM
      timezone: "America/New_York"
  - id: Thu-Morning
    reference_time:
      day: Thursday
      start: "10:00"  # 10:00 AM
      end: "12:00"    # 12:00 PM
      timezone: "America/New_York"
